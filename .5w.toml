# 5W, managing its own development. The version is `requires`.

# The oldest 5w this project works with; an older one refuses. `5w update-files --pin` raises it.
requires = "0.1.2"
trunk = "main"
file = "TASKS.md"
archive = "DONE.md"
title_max = 120
commit_prefix = "chore(tasks)"
perennial = []
# Everything that lands here is reviewed.
require_task = true
default_lane = "agent"

[sections]
open = "## Open"
done = "## Done"

[levels]
1 = "mechanical — a small fast model"
2 = "standard implementation — a mid model"
3 = "design judgement — the strongest model"
4 = "open research — the strongest model, and review the reasoning"

[lanes.agent]
kind = "agent"

[lanes.restricted]
kind = "restricted"
note = "needs the mmmeon signing key, gh with release rights on mmmeon/5W, or network to GitHub"

[lanes.manual]
kind = "manual"
note = "needs hardware or a person at a browser"

[lanes.owner]
kind = "decision"

[worktrees]
root = "../5W-wt"
links_file = ".worktree-links"
disposable = ["target", "dist"]

[delegate]
context = ["CLAUDE.md", "README.md"]
area_docs = []
conventions = ["CLAUDE.md"]
footer = """
steps:
  {setup}
  cd "$({wt} path {branch})"
  work; cargo fmt, cargo clippy --all-targets and cargo test clean; commit (signed), then:
  {tasks} submit {id} {branch}
rules: do not ship or close it. A fix starts as a test that fails without it. Docs that describe
the change (README.md, PROTOCOL.md and templates/PROTOCOL.md) change with it. If 5w refuses, the
refusal names the fix; a refusal that itself looks wrong: 5w report "<what happened>".
"""

[review]
checklist = [
  "cargo fmt, cargo clippy --all-targets and cargo test are clean; the report quotes them",
  "Every fix and feature has a test, and a fix's test fails without the fix",
  "README.md, PROTOCOL.md and templates/PROTOCOL.md describe the change; the two protocols differ only by the stamp line",
  "No dependency added, and nothing project-specific (a lane name, a game, a forge) built into behaviour",
  "Refusals stay one line naming the fix; output stays compact off a terminal",
  "Commits are signed as mmmeon <si@mmmeon.com>",
]

[commands]
tasks = "5w"
wt = "5w wt"
ship = "5w ship"
