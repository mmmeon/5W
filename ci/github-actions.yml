# 5w — copy to .github/workflows/5w.yml. The same file runs on Forgejo and Gitea
# Actions (.forgejo/workflows/ or .gitea/workflows/).
#
# 5w is installed at the version .5w.toml pins (`requires`), verified against the
# release's SHA256SUMS and, when present, its signature. Upgrading a project is
# one line in .5w.toml. The install step below is ci/install-5w.sh, inlined.
#
# Make the `5w` check required on the trunk. A change request stays red until its
# task is accepted; re-run the check after `5w accept`.
#
# Forge events as queue transitions (optional; delete the `events` step to opt out):
# opening or pushing to a change request submits the task naming its branch, and
# an approving review by someone with write access accepts it at the reviewed
# commit, then the check re-runs. The job pushes the queue commit to the trunk,
# so the token must be allowed to push there; the commit is unsigned unless the
# runner has a key. Change requests from forks get a read-only token: submit and
# accept those by hand. See the README's *Forge events*.
name: 5w
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install 5w (the version .5w.toml requires)
        run: |
          set -eu
          dest="$HOME/.local/bin"
          KEY_FPR=1125DC32ECA09CA21A1810DE3491A839212CC7DB   # mmmeon <si@mmmeon.com>, signing subkey
          REPO=${FIVEW_REPO:-mmmeon/5W}

          v=$(sed -n 's/^requires *= *"\([0-9][0-9.]*\)".*/\1/p' .5w.toml 2>/dev/null | head -1)
          [ -n "$v" ] || { echo "install-5w: no requires = \"x.y.z\" in ./.5w.toml" >&2; exit 1; }
          target="$(uname -m)-unknown-linux-musl"
          asset="5w-$v-$target"
          base="https://github.com/$REPO/releases/download/v$v"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          curl -fsSL "$base/$asset" -o "$tmp/$asset"
          curl -fsSL "$base/SHA256SUMS" -o "$tmp/SHA256SUMS"
          ( cd "$tmp" && grep "  $asset\$" SHA256SUMS | sha256sum -c - ) >&2 \
            || { echo "install-5w: $asset does not match SHA256SUMS" >&2; exit 1; }

          if curl -fsSL "$base/SHA256SUMS.asc" -o "$tmp/SHA256SUMS.asc" 2>/dev/null; then
            curl -fsSL "https://raw.githubusercontent.com/$REPO/v$v/SIGNING_KEY.asc" -o "$tmp/key.asc"
            export GNUPGHOME="$tmp/gnupg"; mkdir -m 700 "$GNUPGHOME"
            gpg --batch --quiet --import "$tmp/key.asc"
            # Trust comes from the fingerprint pinned in this file, not from the key download.
            gpg --batch --status-fd 1 --verify "$tmp/SHA256SUMS.asc" "$tmp/SHA256SUMS" 2>/dev/null \
              | grep -q "^\[GNUPG:\] VALIDSIG $KEY_FPR " \
              || { echo "install-5w: SHA256SUMS is not signed by $KEY_FPR" >&2; exit 1; }
            echo "install-5w: signature ok ($KEY_FPR)" >&2
          elif [ "${FIVEW_REQUIRE_SIGNATURE:-}" = 1 ]; then
            echo "install-5w: release v$v has no SHA256SUMS.asc and FIVEW_REQUIRE_SIGNATURE=1" >&2; exit 1
          fi

          mkdir -p "$dest"
          install -m 755 "$tmp/$asset" "$dest/5w"
          echo "install-5w: $("$dest/5w" --version) → $dest/5w" >&2
          echo "$dest" >> "$GITHUB_PATH"
      - name: events
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event_name == 'pull_request' ||
           (github.event.review.state == 'approved' &&
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)))
        env:
          EVENT: ${{ github.event_name }}
          TRUNK: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
          REVIEWED: ${{ github.event.review.commit_id }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$EVENT" = pull_request ]; then set -- --event submit
          else set -- --event accept --at "$REVIEWED"; fi
          # A racing job moves the trunk first: take its queue and re-run (a re-run is a no-op).
          for try in 1 2 3; do
            git fetch -q origin "+refs/heads/$TRUNK:refs/heads/$TRUNK"
            5w ci "$@" --branch "$PR_BRANCH" --head "$PR_HEAD"
            git push -q origin "refs/heads/$TRUNK" && exit 0
          done
          exit 1
      - name: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != push ]; then
            5w ci --base "$PR_BASE" --head "$PR_HEAD" --branch "$PR_BRANCH"
          else
            5w ci --base "$BEFORE" --head "$GITHUB_SHA" --ref "$REF"
          fi
