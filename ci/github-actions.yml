# 5w — copy to .github/workflows/5w.yml. The same file runs on Forgejo and Gitea
# Actions (.forgejo/workflows/ or .gitea/workflows/).
#
# 5w is installed at the version .5w.toml pins (`requires`), verified against the
# release's SHA256SUMS and, when present, its signature. Upgrading a project is
# one line in .5w.toml. The install step below is ci/install-5w.sh, inlined.
#
# Make the `5w` check required on the trunk. A change request stays red until its
# task is accepted; re-run the check after `5w accept`.
#
# This workflow is read-only, and must stay so: on a change request GitHub runs the
# change request's own copy of it, which its author can edit. Queue edits from
# forge events (submit, accept) happen in ci/github-queue-events.yml, which runs
# from the default branch when this one completes. Never grant GITHUB_TOKEN push
# to the trunk.
name: 5w
on:
  push:
  pull_request:
  # Only to wake ci/github-queue-events.yml when a review is submitted.
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install 5w (the version .5w.toml requires)
        run: |
          set -eu
          dest="$HOME/.local/bin"
          KEY_FPR=1125DC32ECA09CA21A1810DE3491A839212CC7DB   # mmmeon <si@mmmeon.com>, signing subkey
          REPO=${FIVEW_REPO:-mmmeon/5W}

          v=$(sed -n 's/^requires *= *"\([0-9][0-9.]*\)".*/\1/p' .5w.toml 2>/dev/null | tail -n 1)
          [ -n "$v" ] || { echo "install-5w: no requires = \"x.y.z\" in ./.5w.toml" >&2; exit 1; }
          target="$(uname -m)-unknown-linux-musl"
          asset="5w-$v-$target"
          base="https://github.com/$REPO/releases/download/v$v"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          curl -fsSL "$base/$asset" -o "$tmp/$asset"
          curl -fsSL "$base/SHA256SUMS" -o "$tmp/SHA256SUMS"
          ( cd "$tmp" && grep "  $asset\$" SHA256SUMS | sha256sum -c - ) >&2 \
            || { echo "install-5w: $asset does not match SHA256SUMS" >&2; exit 1; }

          if curl -fsSL "$base/SHA256SUMS.asc" -o "$tmp/SHA256SUMS.asc" 2>/dev/null; then
            curl -fsSL "https://raw.githubusercontent.com/$REPO/v$v/SIGNING_KEY.asc" -o "$tmp/key.asc"
            export GNUPGHOME="$tmp/gnupg"; mkdir -m 700 "$GNUPGHOME"
            gpg --batch --quiet --import "$tmp/key.asc"
            # Trust comes from the fingerprint pinned in this file, not from the key download.
            gpg --batch --status-fd 1 --verify "$tmp/SHA256SUMS.asc" "$tmp/SHA256SUMS" 2>/dev/null \
              | grep -q "^\[GNUPG:\] VALIDSIG $KEY_FPR " \
              || { echo "install-5w: SHA256SUMS is not signed by $KEY_FPR" >&2; exit 1; }
            echo "install-5w: signature ok ($KEY_FPR)" >&2
          elif [ "${FIVEW_REQUIRE_SIGNATURE:-}" = 1 ]; then
            echo "install-5w: release v$v has no SHA256SUMS.asc and FIVEW_REQUIRE_SIGNATURE=1" >&2; exit 1
          fi

          mkdir -p "$dest"
          install -m 755 "$tmp/$asset" "$dest/5w"
          echo "install-5w: $("$dest/5w" --version) → $dest/5w" >&2
          echo "$dest" >> "$GITHUB_PATH"
      - name: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT" != push ]; then
            5w ci --base "$PR_BASE" --head "$PR_HEAD" --branch "$PR_BRANCH"
          else
            5w ci --base "$BEFORE" --head "$GITHUB_SHA" --ref "$REF"
          fi
