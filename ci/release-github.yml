# 5w release. Tag with ci/tag-release.sh (a signed tag carrying SHA256SUMS) and push
# it: this checks the tag's signature, rebuilds with ci/release.sh, tests, refuses
# unless the sums equal the signed ones, and publishes. ci/sign-release.sh then
# attaches SHA256SUMS.asc. (ci/release-github.yml is the same file, for other repositories.)
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag matches Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      - name: the tag is signed by the release key
        run: |
          # checkout can leave an annotated tag lightweight; fetch the real object.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gpg --batch --import SIGNING_KEY.asc
          git verify-tag --raw "$GITHUB_REF_NAME" 2>&1 \
            | grep -q '^\[GNUPG:\] VALIDSIG 1125DC32ECA09CA21A1810DE3491A839212CC7DB ' \
            || { echo "tag $GITHUB_REF_NAME is not signed by the release key"; exit 1; }
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents:body)' \
            | grep -E '^[0-9a-f]{64}  5w-' > "$RUNNER_TEMP/tag-sums"
          [ -s "$RUNNER_TEMP/tag-sums" ] || { echo "the tag carries no SHA256SUMS (ci/tag-release.sh)"; exit 1; }
      - name: build and test
        run: ci/release.sh
      - name: the build is the one that was signed
        run: diff "$RUNNER_TEMP/tag-sums" dist/SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/5w-* dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes "Static Linux binaries. Verify with: sha256sum -c SHA256SUMS"
