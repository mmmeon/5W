# 5w — include in .gitlab-ci.yml (or copy the job). 5w is installed at the version
# .5w.toml pins (`requires`), verified against SHA256SUMS and, when present, its
# signature; the before_script is ci/install-5w.sh, inlined. Make the pipeline
# required to merge; a merge request stays red until its task is accepted —
# re-run the pipeline after `5w accept`.
#
# The `5w` job is read-only, and must stay so: a merge request pipeline runs the
# source branch's .gitlab-ci.yml, which its author can edit. Queue edits from
# forge events are the `5w:queue-events` job below — see its comment.
5w:
  image: debian:stable-slim
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null
  before_script:
    - apt-get update -qq && apt-get install -qq -y curl gnupg >/dev/null
    - |
      set -eu
      dest=/usr/local/bin
      KEY_FPR=1125DC32ECA09CA21A1810DE3491A839212CC7DB   # mmmeon <si@mmmeon.com>, signing subkey
      REPO=${FIVEW_REPO:-mmmeon/5W}

      v=$(sed -n 's/^requires *= *"\([0-9][0-9.]*\)".*/\1/p' .5w.toml 2>/dev/null | head -1)
      [ -n "$v" ] || { echo "install-5w: no requires = \"x.y.z\" in ./.5w.toml" >&2; exit 1; }
      target="$(uname -m)-unknown-linux-musl"
      asset="5w-$v-$target"
      base="https://github.com/$REPO/releases/download/v$v"
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT

      curl -fsSL "$base/$asset" -o "$tmp/$asset"
      curl -fsSL "$base/SHA256SUMS" -o "$tmp/SHA256SUMS"
      ( cd "$tmp" && grep "  $asset\$" SHA256SUMS | sha256sum -c - ) >&2 \
        || { echo "install-5w: $asset does not match SHA256SUMS" >&2; exit 1; }

      if curl -fsSL "$base/SHA256SUMS.asc" -o "$tmp/SHA256SUMS.asc" 2>/dev/null; then
        curl -fsSL "https://raw.githubusercontent.com/$REPO/v$v/SIGNING_KEY.asc" -o "$tmp/key.asc"
        export GNUPGHOME="$tmp/gnupg"; mkdir -m 700 "$GNUPGHOME"
        gpg --batch --quiet --import "$tmp/key.asc"
        # Trust comes from the fingerprint pinned in this file, not from the key download.
        gpg --batch --status-fd 1 --verify "$tmp/SHA256SUMS.asc" "$tmp/SHA256SUMS" 2>/dev/null \
          | grep -q "^\[GNUPG:\] VALIDSIG $KEY_FPR " \
          || { echo "install-5w: SHA256SUMS is not signed by $KEY_FPR" >&2; exit 1; }
        echo "install-5w: signature ok ($KEY_FPR)" >&2
      elif [ "${FIVEW_REQUIRE_SIGNATURE:-}" = 1 ]; then
        echo "install-5w: release v$v has no SHA256SUMS.asc and FIVEW_REQUIRE_SIGNATURE=1" >&2; exit 1
      fi

      mkdir -p "$dest"
      install -m 755 "$tmp/$asset" "$dest/5w"
      echo "install-5w: $("$dest/5w" --version) → $dest/5w" >&2
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        5w ci --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --head "$CI_COMMIT_SHA" \
              --branch "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" \
              --trunk "refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      else
        5w ci --base "$CI_COMMIT_BEFORE_SHA" --head "$CI_COMMIT_SHA" --ref "refs/heads/$CI_COMMIT_BRANCH"
      fi

# Forge events as queue edits (optional). A scheduled pipeline on the default
# branch — never a merge request pipeline, which runs code its author controls —
# submits each open merge request's task, and accepts it once it is approved.
#
# - Create a pipeline schedule on the default branch (every few minutes).
# - FIVEW_QUEUE_TOKEN: a project access token with `api` and `write_repository`,
#   allowed to push the trunk, as a protected variable scoped to the `5w-queue`
#   environment, and make that a protected environment only maintainers deploy
#   to. No other job references the environment, so no other job can read it.
# - Turn on "Remove all approvals when commits are added": GitLab records who
#   approved, not which commit, so an approval must not survive a push. The job
#   refuses to accept while that setting is off.
# - An approval counts only if given after the current head arrived (the versions
#   API), by someone with at least Developer access who neither opened the merge
#   request nor authored or committed its commits (by the emails GitLab shows the
#   token); a merge request with changes requested is not accepted.
# - Set "Minimum role to use pipeline variables" to Owner or no one: a variable
#   such as CI_API_V4_URL or CI_SERVER_URL set on a pipeline or schedule would
#   send the token elsewhere.
# - Merge requests from forks are left alone. Do not enable "run pipelines in
#   the parent project" for merge requests from forks you do not trust: that runs
#   the fork's .gitlab-ci.yml with the parent's variables.
# - The 5w version is pinned here, never read from a merge request. Queue commits
#   are unsigned unless the runner has a key.
5w:queue-events:
  image: debian:stable-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: 5w-queue
    action: access
  resource_group: 5w-queue
  variables:
    GIT_DEPTH: "0"
    FIVEW_VERSION: "0.1.4" # pinned here, never read from a merge request; a release with `ci --event`
  before_script:
    - apt-get update -qq && apt-get install -qq -y curl gnupg jq git >/dev/null
    - |
      set -eu
      KEY_FPR=1125DC32ECA09CA21A1810DE3491A839212CC7DB   # mmmeon <si@mmmeon.com>, signing subkey
      v=$FIVEW_VERSION
      asset="5w-$v-$(uname -m)-unknown-linux-musl"
      base="https://github.com/mmmeon/5W/releases/download/v$v"
      tmp=$(mktemp -d)
      curl -fsSL "$base/$asset" -o "$tmp/$asset"
      curl -fsSL "$base/SHA256SUMS" -o "$tmp/SHA256SUMS"
      ( cd "$tmp" && grep "  $asset\$" SHA256SUMS | sha256sum -c - ) >&2
      curl -fsSL "$base/SHA256SUMS.asc" -o "$tmp/SHA256SUMS.asc"
      curl -fsSL "https://raw.githubusercontent.com/mmmeon/5W/v$v/SIGNING_KEY.asc" -o "$tmp/key.asc"
      export GNUPGHOME="$tmp/gnupg"; mkdir -m 700 "$GNUPGHOME"
      gpg --batch --quiet --import "$tmp/key.asc"
      gpg --batch --status-fd 1 --verify "$tmp/SHA256SUMS.asc" "$tmp/SHA256SUMS" 2>/dev/null \
        | grep -q "^\[GNUPG:\] VALIDSIG $KEY_FPR " \
        || { echo "install-5w: SHA256SUMS is not signed by $KEY_FPR" >&2; exit 1; }
      install -m 755 "$tmp/$asset" /usr/local/bin/5w
      rm -rf "$tmp"
  script:
    - |
      set -eu
      api() { curl -fsS --header "PRIVATE-TOKEN: $FIVEW_QUEUE_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/$1"; }
      trunk=$CI_DEFAULT_BRANCH
      [ "$(api approvals | jq -r .reset_approvals_on_push)" = true ] \
        || { echo "5w: turn on \"Remove all approvals when commits are added\" before accepting from CI" >&2; exit 1; }
      git config user.name "5w queue events"; git config user.email "5w-queue@$CI_SERVER_HOST"
      git checkout -q --detach
      # Push with the token in git's environment for that one command, not in its arguments.
      push() (
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$CI_SERVER_URL/.extraheader"
        GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'oauth2:%s' "$FIVEW_QUEUE_TOKEN" | base64 -w0)"
        export GIT_CONFIG_VALUE_0
        git push -q "$CI_SERVER_URL/$CI_PROJECT_PATH.git" "$@"
      )
      # ISO 8601 times as epoch seconds, fractions and offsets allowed.
      epoch='sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601'
      status=0
      page=1
      while :; do
        mrs=$(api "merge_requests?state=opened&target_branch=$trunk&per_page=100&page=$page" \
          | jq -r --argjson p "$CI_PROJECT_ID" '.[] | select(.source_project_id == $p) | .iid')
        [ -n "$mrs" ] || break
        all="${all:-} $mrs"
        page=$((page + 1))
      done
      for mr in ${all:-}; do
        m=$(api "merge_requests/$mr")
        head=$(printf '%s' "$m" | jq -r .sha); branch=$(printf '%s' "$m" | jq -r .source_branch)
        author=$(printf '%s' "$m" | jq -r .author.id)
        # When the current head arrived: an approval from before it is of an older commit,
        # whatever the approval reset has caught up with.
        since=$(api "merge_requests/$mr/versions" | jq -r --arg h "$head" \
          "[.[] | select(.head_commit_sha == \$h) | .created_at | $epoch] | min // empty")
        # Emails of whoever wrote or committed the change: they do not approve it.
        makers=$(api "merge_requests/$mr/commits?per_page=100" \
          | jq -c '[.[] | .author_email, .committer_email | select(. != null) | ascii_downcase] | unique')
        approver=
        if [ "$(printf '%s' "$m" | jq -r .detailed_merge_status)" = requested_changes ]; then
          echo "!$mr has changes requested: not accepting"
        elif [ -z "$since" ]; then
          echo "!$mr: no version with head $head yet; the next run decides"
        else
          for id in $(api "merge_requests/$mr/approvals" | jq -r --argjson a "$author" --argjson since "$since" \
              ".approved_by[] | select(.user.id != \$a and .approved_at != null and (.approved_at | $epoch) > \$since) | .user.id"); do
            level=$(api "members/all/$id" 2>/dev/null | jq -r '.access_level // 0') || level=0
            [ "${level:-0}" -ge 30 ] || continue
            emails=$(api "users/$id" 2>/dev/null \
              | jq -c '[.email, .public_email, .commit_email | select(. != null and . != "") | ascii_downcase]') || emails='[]'
            [ "$(jq -n --argjson e "${emails:-[]}" --argjson m "$makers" '[$e[] | select(. as $x | $m | index($x))] | length')" = 0 ] \
              || { echo "!$mr: approver $id wrote or committed the change; not counted"; continue; }
            approver=$id; break
          done
        fi
        git fetch -q origin "+refs/merge-requests/$mr/head:refs/5w/change-request"
        [ "$(git rev-parse refs/5w/change-request)" = "$head" ] || { echo "!$mr moved; the next run decides"; continue; }
        ok=
        for _ in 1 2 3; do
          git fetch -q origin "+refs/heads/$trunk:refs/heads/$trunk"
          5w ci --event submit --branch "$branch" --head "$head" || break
          if [ -n "$approver" ]; then
            5w ci --event accept --branch "$branch" --head "$head" --at "$head" || break
          fi
          if [ "$(git rev-parse "refs/heads/$trunk")" = "$(git rev-parse "origin/$trunk")" ] \
            || push "refs/heads/$trunk:refs/heads/$trunk"; then ok=1; break; fi
        done
        [ -n "$ok" ] || status=1
      done
      exit $status
